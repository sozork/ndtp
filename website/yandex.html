    <script src="https://cdn.jsdelivr.net/npm/sql.js@1.14.1/dist/sql-wasm-browser.js"></script>
    <script>
        window.addEventListener('load', async () => {
        // initSqlJs is now guaranteed to exist
            const SQL = await initSqlJs({
                locateFile: file => `https://cdn.jsdelivr.net/npm/sql.js@1.14.1/dist/${file}`
            });
            const response = await fetch('../data.db');
            const db_data = await response.arrayBuffer();
            const uint8Array = new Uint8Array(db_data);
            const db = new SQL.Database(uint8Array);
            const results = db.exec("SELECT COUNT(*) FROM yandex");
            console.log(results);
        });
    </script>
